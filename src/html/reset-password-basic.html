<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-color="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password | AumaUI</title>
    <meta
      name="description"
      content="Update your AumaUI account password securely."
    />
    <link
      rel="icon"
      href="../assets/images/brand-logos/favicon.svg?v=2" type="image/svg+xml" />
    <link
      id="style"
      href="../assets/libs/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/demo.css" rel="stylesheet" />
    <link href="../assets/css/icons.css" rel="stylesheet" />
    <script src="../assets/js/authentication.js"></script>
  </head>

  <body class="password-create-page password-create-basic password-reset-page">
    <main class="password-basic-shell">
      <section
        class="card custom-card password-basic-card"
        aria-labelledby="reset-password-title"
      >
        <div class="card-body">
          <a
            class="password-brand"
            href="index.html"
            aria-label="AumaUI home"
          >
            <picture class="auth-brand-logos"
              ><img
                class="auth-logo-light"
                src="../assets/images/brand-logos/desktop-logo.svg"
                alt="AumaUI" /><img
                class="auth-logo-dark"
                src="../assets/images/brand-logos/desktop-dark.svg"
                alt="AumaUI"
            /></picture>
          </a>

          <div class="password-reset-heading">
            <div>
              <h1 id="reset-password-title">Reset password</h1>
              <p class="password-intro">
                Choose a new password to keep your account secure.
              </p>
            </div>
          </div>

          <form class="password-form">
            <div class="mb-3">
              <label class="form-label" for="reset-password">
                Current password
              </label>
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="reset-password"
                  name="currentPassword"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your current password"
                  required
                />
                <button
                  class="btn btn-link password-visibility"
                  type="button"
                  onclick="createpassword('reset-password', this)"
                  aria-label="Show current password"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="reset-newpassword">
                New password
              </label>
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="reset-newpassword"
                  name="newPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Enter a new password"
                  required
                />
                <button
                  class="btn btn-link password-visibility"
                  type="button"
                  onclick="createpassword('reset-newpassword', this)"
                  aria-label="Show new password"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="reset-confirmpassword">
                Confirm new password
              </label>
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="reset-confirmpassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Re-enter your new password"
                  required
                />
                <button
                  class="btn btn-link password-visibility"
                  type="button"
                  onclick="createpassword('reset-confirmpassword', this)"
                  aria-label="Show password confirmation"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </form>

          <a
            class="btn btn-primary w-100 d-flex justify-content-center align-items-center btn-lg"
            href="index.html"
          >
            Update password
            <i class="ri-arrow-right-line ms-1" aria-hidden="true"></i>
          </a>

          <div class="password-back-link">
            <a href="sign-in-basic.html">
              <i class="ri-arrow-left-line me-1" aria-hidden="true"></i>
              Back to sign in
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/show-password.js"></script>
    <script>
      document.querySelectorAll("[data-current-year]").forEach((element) => {
        element.textContent = String(new Date().getFullYear());
      });
    </script>
  </body>
</html>
