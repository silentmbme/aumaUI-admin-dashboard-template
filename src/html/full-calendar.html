<!-- include document-head.html"-->
  </head>

  <body>
    <div class="progress-top-bar"></div>
    <!-- include appearance-customizer.html"-->
    <!-- include page-loader.html"-->
    <div class="page">
      <!-- include top-navigation.html"-->
      <!-- include side-navigation.html"-->
      <main class="main-content app-content">
        <div
          class="page-header-breadcrumb d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3"
        >
          <h1 class="page-title">Calendar</h1>
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Applications</li>
            <li class="breadcrumb-item active" aria-current="page">Calendar</li>
          </ol>
        </div>
        <div class="container-fluid">
          <div class="card custom-card calendar-reference appointment-calendar">
            <div class="calendar-reference-layout">
              <aside
                class="calendar-reference-sidebar"
                aria-label="Event templates"
              >
                <button
                  type="button"
                  class="btn btn-dark w-100"
                  id="calendar-create"
                >
                  <i class="ri-add-line me-2" aria-hidden="true"></i>Create
                  event
                </button>
                <div
                  id="appointment-agenda"
                  class="mt-3"
                  aria-label="Team events by day"
                ></div>
              </aside>
              <section
                class="calendar-reference-main"
                aria-label="Team schedule"
              >
                <div class="calendar-reference-toolbar">
                  <div class="d-flex gap-2">
                    <div
                      class="btn-group"
                      role="group"
                      aria-label="Calendar navigation"
                    >
                      <button
                        type="button"
                        class="btn btn-secondary-transparent btn-sm"
                        id="calendar-prev"
                      >
                        Prev</button
                      ><button
                        type="button"
                        class="btn btn-secondary-transparent border-start-0 btn-sm"
                        id="calendar-next"
                      >
                        Next
                      </button>
                    </div>
                    <button
                      type="button"
                      class="btn btn-success btn-sm"
                      id="calendar-today"
                    >
                      Today
                    </button>
                  </div>
                  <h2
                    class="fs-18 fw-semibold mb-0"
                    id="calendar-period-title"
                  ></h2>
                  <div
                    class="btn-group"
                    role="group"
                    aria-label="Calendar view"
                  >
                    <button
                      type="button"
                      class="btn btn-light btn-sm active"
                      data-calendar-view="dayGridMonth"
                      aria-pressed="true"
                    >
                      Month</button
                    ><button
                      type="button"
                      class="btn btn-light btn-sm"
                      data-calendar-view="timeGridWeek"
                      aria-pressed="false"
                    >
                      Week</button
                    ><button
                      type="button"
                      class="btn btn-light btn-sm"
                      data-calendar-view="timeGridDay"
                      aria-pressed="false"
                    >
                      Day</button
                    ><button
                      type="button"
                      class="btn btn-light btn-sm"
                      data-calendar-view="listWeek"
                      aria-pressed="false"
                    >
                      List
                    </button>
                  </div>
                </div>
                <div id="calendar" aria-label="Event calendar"></div>
              </section>
            </div>
          </div>
          <p
            id="calendar-feedback"
            class="text-muted fs-12"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </main>
      <!-- include site-footer.html"-->
      <!-- include responsive-search-dialog.html"-->
    </div>

    <div
      class="modal fade"
      id="addEvent"
      tabindex="-1"
      aria-labelledby="addEventLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="calendar-event-form">
          <div class="modal-header">
            <div>
              <h2 class="modal-title fs-15 fw-semibold" id="addEventLabel">
                Create event
              </h2>
              <p class="text-muted fs-11 mb-0">
                Schedule a meeting, review, or team milestone.
              </p>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="eventName">Event name</label
              ><input
                class="form-control"
                id="eventName"
                placeholder="e.g. Product planning session"
                required
              />
            </div>
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label" for="fromDate">Start date</label
                ><input
                  class="form-control"
                  id="fromDate"
                  type="date"
                  required
                />
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="toDate">End date</label
                ><input class="form-control" id="toDate" type="date" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="eventType">Calendar</label>
                <select class="form-select" data-trigger id="eventType">
                  <option value="team">Team schedule</option>
                  <option value="meeting">Meeting</option>
                  <option value="deadline">Deadline</option>
                  <option value="personal">Personal</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="event-description"
                  >Description
                  <span class="text-muted fw-normal">(optional)</span></label
                ><textarea
                  class="form-control"
                  id="event-description"
                  rows="3"
                  placeholder="Add an agenda, location, or preparation notes"
                ></textarea>
              </div>
            </div>
            <p
              class="text-danger fs-11 mt-2 mb-0 d-none"
              id="calendar-form-error"
              role="alert"
            ></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-dark">
              <i class="ri-add-line me-1"></i>Add to calendar
            </button>
          </div>
        </form>
      </div>
    </div>
    <div
      class="modal fade"
      id="eventModal"
      tabindex="-1"
      aria-labelledby="modalEventName"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <span
                class="calendar-event-category-label"
                id="modalEventCategory"
                >Team</span
              >
              <h2
                class="modal-title fs-15 fw-semibold mt-1"
                id="modalEventName"
              ></h2>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="text-muted fs-12" id="modalEventDescription"></p>
            <div class="calendar-event-detail-line">
              <i class="ri-calendar-line"></i><span id="modalEventStart"></span>
            </div>
            <div class="calendar-event-detail-line">
              <i class="ri-time-line"></i><span id="modalEventEnd"></span>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <button
              type="button"
              class="btn btn-outline-danger"
              id="deleteEventButton"
            >
              <i class="ri-delete-bin-line me-1"></i>Delete event</button
            ><button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- include common-scripts.html"-->
    <script src="../assets/libs/fullcalendar/index.global.min.js"></script>
    <script src="../assets/js/fullcalendar.js"></script>
    <script src="../assets/js/app-interactions.js"></script>
    <!-- include appearance-customizer-scripts.html"-->
  </body>
</html>
