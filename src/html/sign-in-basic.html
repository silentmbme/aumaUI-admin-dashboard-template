<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-color="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | AumaUI</title>
    <meta name="description" content="Sign in to your AumaUI workspace." />
    <link
      rel="icon"
      href="../assets/images/brand-logos/favicon.svg?v=2" type="image/svg+xml" />
    <link
      id="style"
      href="../assets/libs/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/demo.css" rel="stylesheet" />
    <link href="../assets/css/icons.css" rel="stylesheet" />
    <script src="../assets/js/authentication.js"></script>
  </head>
  <body class="password-create-page password-create-basic password-signin-page">
    <main class="password-basic-shell">
      <section
        class="card custom-card password-basic-card"
        aria-labelledby="signin-title"
      >
        <div class="card-body">
          <a
            class="password-brand"
            href="index.html"
            aria-label="AumaUI home"
          >
            <picture class="auth-brand-logos"
              ><img
                class="auth-logo-light"
                src="../assets/images/brand-logos/desktop-logo.svg"
                alt="AumaUI" /><img
                class="auth-logo-dark"
                src="../assets/images/brand-logos/desktop-dark.svg"
                alt="AumaUI"
            /></picture>
          </a>

          <h1 id="signin-title">Welcome back</h1>
          <p class="password-intro">Sign in to continue to your workspace.</p>

          <form class="password-form signin-form">
            <div class="mb-3">
              <label class="form-label" for="signin-email">Email address</label>
              <input
                class="form-control"
                id="signin-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="name@company.com"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="signin-password">Password</label>
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="signin-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  required
                />
                <button
                  class="btn btn-link password-visibility"
                  type="button"
                  onclick="createpassword('signin-password', this)"
                  aria-label="Show password"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="signin-options mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  id="signin-remember"
                  name="remember"
                  type="checkbox"
                  checked
                />
                <label
                  class="form-check-label text-muted fs-12"
                  for="signin-remember"
                >
                  Remember me
                </label>
              </div>
              <a href="reset-password-basic.html">Forgot password?</a>
            </div>
          </form>

          <a class="btn btn-primary w-100 btn-lg" href="index.html">
            Sign in
            <i class="ri-arrow-right-line ms-1" aria-hidden="true"></i>
          </a>

          <div class="password-back-link">
            New to AumaUI?
            <a href="sign-up-basic.html">Create an account</a>
          </div>
        </div>
      </section>

      <footer class="password-page-footer">
        &copy; <span data-current-year></span> AumaUI
        <span>&middot;</span> Your work, all in one place
      </footer>
    </main>

    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/show-password.js"></script>
    <script>
      document.querySelectorAll("[data-current-year]").forEach((element) => {
        element.textContent = String(new Date().getFullYear());
      });
    </script>
  </body>
</html>
