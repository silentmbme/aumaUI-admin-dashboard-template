<!-- Workspace loader -->
<div
  id="loader"
  role="status"
  aria-live="polite"
  aria-label="Loading workspace"
>
  <div class="app-loader-content">
    <picture class="app-loader-logo">
      <img
        class="app-loader-logo-light"
        src="../assets/images/brand-logos/desktop-logo.svg"
        alt="AumaUI"
      />
      <img
        class="app-loader-logo-dark"
        src="../assets/images/brand-logos/desktop-dark.svg"
        alt=""
      />
    </picture>
    <span class="app-loader-label">Loading your workspace</span>
    <div class="app-loader-progress" aria-hidden="true"><span></span></div>
  </div>
</div>
<!-- Workspace loader -->
