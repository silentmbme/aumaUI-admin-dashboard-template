<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-color="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create password | AumaUI</title>
    <meta
      name="description"
      content="Create a secure password for your AumaUI account."
    />
    <link
      rel="icon"
      href="../assets/images/brand-logos/favicon.svg?v=2" type="image/svg+xml" />
    <link
      href="../assets/libs/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/demo.css" rel="stylesheet" />
    <link href="../assets/css/icons.css" rel="stylesheet" />
    <script src="../assets/js/authentication.js"></script>
  </head>

  <body class="password-create-page password-create-basic">
    <main class="password-basic-shell">
      <section
        class="card custom-card password-basic-card"
        aria-labelledby="create-password-title"
      >
        <div class="card-body">
          <a class="password-brand" href="index.html" aria-label="AumaUI home"
            ><picture class="auth-brand-logos"
              ><img
                class="auth-logo-light"
                src="../assets/images/brand-logos/desktop-logo.svg"
                alt="AumaUI" /><img
                class="auth-logo-dark"
                src="../assets/images/brand-logos/desktop-dark.svg"
                alt="AumaUI" /></picture
          ></a>
          <h1 id="create-password-title">Create password</h1>
          <p class="password-intro">
            Choose a strong password to finish setting up your account.
          </p>

          <form class="password-form" data-password-form novalidate>
            <div class="mb-3">
              <label class="form-label" for="create-password"
                >New password</label
              >
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="create-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Enter a new password"
                  required
                  aria-describedby="password-strength-meter"
                /><button
                  class="btn btn-link password-visibility"
                  type="button"
                  data-password-toggle="create-password"
                  aria-label="Show password"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <section
              class="password-strength-block"
              aria-label="Password strength and requirements"
            >
              <div
                class="password-strength-track"
                id="password-strength-meter"
                role="progressbar"
                aria-label="Password strength"
                aria-valuemin="0"
                aria-valuemax="3"
                aria-valuenow="0"
                aria-valuetext="Enter a password"
              >
                <span></span><span></span><span></span>
              </div>
              <ul class="password-rules" aria-label="Password requirements">
                <li data-rule="length">
                  <i
                    class="ri-checkbox-blank-circle-line"
                    aria-hidden="true"
                  ></i
                  ><span>8+ characters</span>
                </li>
                <li data-rule="letter">
                  <i
                    class="ri-checkbox-blank-circle-line"
                    aria-hidden="true"
                  ></i
                  ><span>Upper + lowercase</span>
                </li>
                <li data-rule="number">
                  <i
                    class="ri-checkbox-blank-circle-line"
                    aria-hidden="true"
                  ></i
                  ><span>One number</span>
                </li>
              </ul>
            </section>

            <div class="mb-3">
              <label class="form-label" for="create-confirmpassword"
                >Confirm password</label
              >
              <div class="password-input-wrap">
                <input
                  class="form-control"
                  id="create-confirmpassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Re-enter your password"
                  required
                /><button
                  class="btn btn-link password-visibility"
                  type="button"
                  data-password-toggle="create-confirmpassword"
                  aria-label="Show password"
                >
                  <i class="ri-eye-off-line" aria-hidden="true"></i>
                </button>
              </div>
              <div
                class="password-match-message"
                id="password-match-message"
                aria-live="polite"
              ></div>
            </div>

            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="password-terms"
                required
              /><label
                class="form-check-label text-muted fs-12"
                for="password-terms"
                >I agree to the
                <a href="terms_conditions.html">Terms of Service</a>.</label
              >
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
              Create password
              <i class="ri-arrow-right-line ms-1" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/password-create.js"></script>
  </body>
</html>
