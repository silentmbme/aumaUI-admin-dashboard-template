<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-color="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Something went wrong | AumaUI</title>
    <meta
      name="description"
      content="AumaUI encountered an unexpected error."
    />
    <link
      rel="icon"
      href="../assets/images/brand-logos/favicon.svg?v=2" type="image/svg+xml" />
    <link
      id="style"
      href="../assets/libs/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/demo.css" rel="stylesheet" />
    <link href="../assets/css/icons.css" rel="stylesheet" />
    <script src="../assets/js/authentication.js"></script>
  </head>
  <body class="error-shell error-shell-centered">
    <main class="error-layout" aria-labelledby="error-title">
      <section class="card custom-card error-card">
        <div class="card-body">
          <div class="error-copy">
            <span class="error-symbol" aria-hidden="true"
              ><i class="ri-error-warning-line"></i
            ></span>
            <span class="error-label">SERVER ERROR</span>
            <span class="error-code">500</span>
            <h1 id="error-title">Something went wrong</h1>
            <p class="error-description">
              The request couldn’t be completed right now. Please try again in a
              moment.
            </p>
            <div class="error-actions justify-content-center">
              <a class="btn btn-primary" href="index.html"
                ><i class="ri-home-6-line"></i> Back To dashboard</a
              >
              <a class="btn btn-dark" href="index.html"
                ><i class="ri-arrow-left-line"></i> Go Back</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
